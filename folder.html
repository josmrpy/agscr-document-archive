<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>descargas | josmr.py</title>
  <link rel="icon" href="favicon.ico?v=1" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="site.css">
</head>

<body>

  <nav>
    <a href="index.html" class="nav-home">descargas</a>
    <span class="crumb-sep">/</span>
    <a href="#" id="crumbCurrent" style="color: var(--ink);"></a>
    <span class="nav-spacer"></span>
    <a href="https://josmrpy.github.io/" target="_blank" rel="noopener">josmr.py ↗</a>
  </nav>

  <section id="home" class="hero">
    <p class="eyebrow">Guías y Scouts de Costa Rica</p>
    <h1 id="folderTitle">Carpeta</h1>
    <p class="hero-bio" id="folderBio">
      Documentos disponibles en esta carpeta. Hacé clic para abrir o descargar.
    </p>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Buscar documento…" autocomplete="off">
    </div>
    <p class="search-meta"><strong id="count-label">0</strong> documentos</p>
  </section>

  <hr class="divider">

  <section id="files-section">
    <div class="file-list" id="fileList"></div>
    <p class="empty-hint" id="empty-state">No se encontró ningún documento con ese nombre.</p>
    <p class="empty-hint" id="not-found-state">Esta carpeta no existe en el índice.</p>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>built by Josimar (@josmr.py)</span>
      <img src="favicon.ico?v=1" alt="" style="width:32px;height:32px;object-fit:contain;">
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    function fileIcon() {
      return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
    <path d="M14 2v6h6"/>
  </svg>`;
    }

    function extOf(path) {
      const clean = path.split("?")[0].split("#")[0];
      const dot = clean.lastIndexOf(".");
      return dot === -1 ? "" : clean.slice(dot + 1).toUpperCase();
    }

    const params = new URLSearchParams(window.location.search);
    const folderName = params.get("c") || "";

    const folderTitle = document.getElementById("folderTitle");
    const folderBio = document.getElementById("folderBio");
    const crumbCurrent = document.getElementById("crumbCurrent");
    const fileList = document.getElementById("fileList");
    const searchInput = document.getElementById("search");
    const emptyState = document.getElementById("empty-state");
    const notFoundState = document.getElementById("not-found-state");
    const countLabel = document.getElementById("count-label");

    const docs = FILES_BY_FOLDER[folderName];

    document.title = (folderName || "descargas") + " | josmr.py";
    folderTitle.textContent = folderName || "Carpeta";
    crumbCurrent.textContent = folderName || "";

    if (!docs) {
      folderBio.textContent = "No encontramos esta carpeta en el índice de documentos.";
      notFoundState.style.display = "block";
    } else {
      countLabel.textContent = docs.length;

      docs
        .slice()
        .forEach(doc => {
          const a = document.createElement("a");
          a.className = "file-card";
          a.href = doc.path;
          a.target = "_blank";
          a.rel = "noopener";
          a.dataset.title = doc.title.toLowerCase();

          const ext = extOf(doc.path);
          const badge = doc.local
            ? `<span class="badge">${ext || "archivo"}</span>`
            : `<span class="badge remote">enlace externo</span>`;

          a.innerHTML = `${fileIcon()}<span class="info">
        <span class="title">${doc.title}</span>
        <span class="meta">${badge}<span>#${doc.id}</span></span>
      </span>`;
          fileList.appendChild(a);
        });

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        let visible = 0;
        fileList.querySelectorAll("a.file-card").forEach(a => {
          const match = a.dataset.title.includes(q);
          a.style.display = match ? "" : "none";
          if (match) visible++;
        });
        countLabel.textContent = visible;
        emptyState.style.display = visible === 0 ? "block" : "none";
      });
    }
  </script>

</body>

</html>
